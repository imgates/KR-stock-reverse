<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로젝트H · 매매 장부 대시보드</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --sell: #f87171;
      --buy: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 16px; max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.3rem; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    textarea { width: 100%; height: 95px; background: #0b1120; border: 1px solid var(--border); border-radius: 8px; color: #fff; padding: 10px; font-size: 0.9rem; resize: none; margin-bottom: 8px; }
    button { width: 100%; padding: 12px; background: #2563eb; color: #fff; font-size: 1rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; }
    button:active { background: #1d4ed8; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .stat-box { background: #0b1120; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
    .stat-label { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 4px; }
    .stat-val { font-size: 1.1rem; font-weight: 700; }
    .val-red { color: var(--sell); }
    .val-green { color: var(--buy); }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
    th, td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); }
    th { color: var(--text-sub); font-weight: 500; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-sell { background: rgba(248, 113, 113, 0.2); color: var(--sell); }
    .badge-buy { background: rgba(74, 222, 128, 0.2); color: var(--buy); }
    .reset-btn { background: transparent; border: 1px solid var(--border); color: var(--text-sub); font-size: 0.75rem; padding: 6px; margin-top: 12px; width: auto; float: right; }
  </style>
</head>
<body>

  <h1>📊 프로젝트H 매매 기록 대시보드</h1>

  <!-- 카톡 메시지 붙여넣기 입력창 -->
  <div class="card">
    <div style="font-weight: 600; margin-bottom: 8px;">📲 카카오톡 체결 알림 붙여넣기</div>
    <textarea id="kakaoInput" placeholder="카카오톡 NH투자증권 체결 알림 메시지 전체를 복사해서 여기에 붙여넣으세요..."></textarea>
    <button onclick="parseAndRecord()">대시보드에 즉시 반영</button>
  </div>

  <!-- 포트폴리오 요약 통계 -->
  <div class="card">
    <div style="font-weight: 600; margin-bottom: 10px;">종목별 현황 (보유 / 회수현금)</div>
    <div class="summary-grid" id="portfolioCards"></div>
    <div style="font-size: 0.8rem; color: var(--text-sub); margin-top: 4px;">
      총 회수 현금: <span id="totalCash" style="color: var(--accent); font-weight: bold;">0원</span> | 
      총 누적 확정손익: <span id="totalLoss" style="color: var(--sell); font-weight: bold;">0원</span>
    </div>
  </div>

  <!-- 최근 체결 기록 장부 -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <span style="font-weight: 600;">📝 체결 내역 장부</span>
      <button class="reset-btn" onclick="resetData()">초기화</button>
    </div>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>구분</th>
            <th>종목명</th>
            <th>수량</th>
            <th>체결단가</th>
            <th>실현손익</th>
          </tr>
        </thead>
        <tbody id="tradeHistory"></tbody>
      </table>
    </div>
  </div>

  <script>
    // 초기 계좌 데이터 세팅 (9/8 현재 상태)
    const initialConfig = {
      portfolio: {
        "SK하이닉스": { code: "000660", qty: 12, avgPrice: 2468866, cash: 5222000, targetQty: 3 },
        "SK스퀘어": { code: "402340", qty: 7, avgPrice: 1848188, cash: 4317000, targetQty: 2 }
      },
      trades: [
        { type: "매도", name: "SK하이닉스", qty: 1, price: 1645000, pnl: -823866 },
        { type: "매도", name: "SK스퀘어", qty: 1, price: 1007000, pnl: -841188 },
        { type: "매도", name: "SK스퀘어", qty: 1, price: 1048000, pnl: -800188 },
        { type: "매도", name: "SK하이닉스", qty: 1, price: 1735000, pnl: -733866 },
        { type: "매도", name: "SK스퀘어", qty: 1, price: 1100000, pnl: -748188 },
        { type: "매도", name: "SK스퀘어", qty: 1, price: 1162000, pnl: -686188 },
        { type: "매도", name: "SK하이닉스", qty: 1, price: 1842000, pnl: -626866 }
      ]
    };

    let appData = JSON.parse(localStorage.getItem("stock_dashboard_data")) || initialConfig;

    function saveData() {
      localStorage.setItem("stock_dashboard_data", JSON.stringify(appData));
      render();
    }

    function parseAndRecord() {
      const text = document.getElementById("kakaoInput").value;
      if (!text.trim()) return alert("메시지를 입력해주세요.");

      // 정규식 파싱
      const nameMatch = text.match(/종\s*목\s*명\s*:\s*([^\n\r]+)/);
      const typeMatch = text.match(/체결종류\s*:\s*(매도|매수)/);
      const qtyMatch = text.match(/체결수량\s*:\s*([0-9,]+)주/);
      const priceMatch = text.match(/체결단가\s*:\s*([0-9,]+)원/);

      if (!nameMatch || !typeMatch || !qtyMatch || !priceMatch) {
        return alert("카톡 알림톡 형식을 인식하지 못했습니다. 형식을 확인해주세요.");
      }

      const name = nameMatch[1].trim();
      const type = typeMatch[1];
      const qty = parseInt(qtyMatch[1].replace(/,/g, ""), 10);
      const price = parseInt(priceMatch[1].replace(/,/g, ""), 10);

      // 종목 미등록 시 자동 기본 등록
      if (!appData.portfolio[name]) {
        appData.portfolio[name] = { code: "", qty: 0, avgPrice: price, cash: 0, targetQty: 0 };
      }

      const target = appData.portfolio[name];
      let pnl = 0;

      if (type === "매도") {
        pnl = (price - target.avgPrice) * qty;
        target.qty = Math.max(0, target.qty - qty);
        target.cash += price * qty;
      } else {
        // 매수 시 평단가 및 보유수량 재계산
        const totalCost = (target.qty * target.avgPrice) + (qty * price);
        target.qty += qty;
        target.avgPrice = Math.round(totalCost / target.qty);
        target.cash = Math.max(0, target.cash - (price * qty));
      }

      appData.trades.unshift({ type, name, qty, price, pnl });
      document.getElementById("kakaoInput").value = "";
      saveData();
      alert(`[${name}] ${type} ${qty}주 (${price.toLocaleString()}원) 반영 완료!`);
    }

    function render() {
      const cards = document.getElementById("portfolioCards");
      cards.innerHTML = "";
      let totalCash = 0;
      let totalLoss = 0;

      for (const [name, info] of Object.entries(appData.portfolio)) {
        totalCash += info.cash;
        cards.innerHTML += `
          <div class="stat-box">
            <div class="stat-label">${name} (${info.qty}주 보유 / 목표 ${info.targetQty}주)</div>
            <div class="stat-val">${info.qty}주 <span style="font-size:0.8rem; font-weight:normal; color:var(--text-sub);">/ 평단 ${info.avgPrice.toLocaleString()}원</span></div>
            <div style="font-size:0.75rem; margin-top:4px; color:var(--accent);">회수현금: ${info.cash.toLocaleString()}원</div>
          </div>
        `;
      }

      const history = document.getElementById("tradeHistory");
      history.innerHTML = "";
      appData.trades.forEach(t => {
        if (t.pnl) totalLoss += t.pnl;
        const badgeClass = t.type === "매도" ? "badge-sell" : "badge-buy";
        const pnlText = t.pnl ? `${t.pnl.toLocaleString()}원` : "-";
        history.innerHTML += `
          <tr>
            <td><span class="badge ${badgeClass}">${t.type}</span></td>
            <td>${t.name}</td>
            <td>${t.qty}주</td>
            <td>${t.price.toLocaleString()}원</td>
            <td style="color: ${t.pnl < 0 ? 'var(--sell)' : 'var(--buy)'}">${pnlText}</td>
          </tr>
        `;
      });

      document.getElementById("totalCash").innerText = totalCash.toLocaleString() + "원";
      document.getElementById("totalLoss").innerText = totalLoss.toLocaleString() + "원";
    }

    function resetData() {
      if (confirm("모든 데이터를 오늘(9/8) 기본값으로 되돌리겠습니까?")) {
        appData = JSON.parse(JSON.stringify(initialConfig));
        saveData();
      }
    }

    render();
  </script>
</body>
</html>
