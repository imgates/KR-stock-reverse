<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로젝트H · 클라우드 실시간 대시보드</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --sell: #f87171;
      --buy: #4ade80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 16px; max-width: 800px; margin: 0 auto; }
    
    .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .top-header h1 { font-size: 1.15rem; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .sync-badge { font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; background: #0b1120; border: 1px solid var(--border); }
    .sync-ok { color: var(--buy); border-color: var(--buy); }
    .sync-wait { color: #fbbf24; border-color: #fbbf24; }
    
    .hero-stat-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid #3b82f6;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    .hero-main-group { text-align: center; padding: 4px 0 10px 0; }
    .hero-label { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; }
    .hero-big-number { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; }
    
    .hero-sub-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .hero-sub-item { text-align: center; }
    .hero-sub-label { font-size: 0.75rem; color: var(--text-sub); }
    .hero-sub-val { font-size: 1.1rem; font-weight: 700; margin-top: 2px; }

    .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
    .input-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .date-picker-wrap { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--text-sub); }
    .date-picker-wrap input[type="date"] { background: #0b1120; border: 1px solid var(--border); color: #fff; padding: 4px 6px; border-radius: 6px; font-size: 0.82rem; }

    textarea { width: 100%; height: 85px; background: #0b1120; border: 1px solid var(--border); border-radius: 8px; color: #fff; padding: 10px; font-size: 0.85rem; resize: none; margin-bottom: 8px; }
    button.action-btn { width: 100%; padding: 12px; background: #2563eb; color: #fff; font-size: 0.95rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; }
    button.action-btn:active { background: #1d4ed8; }
    button.action-btn:disabled { background: #475569; cursor: not-allowed; }
    
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
    @media (max-width: 500px) { .summary-grid { grid-template-columns: 1fr; } }
    .stat-box { background: #0b1120; padding: 12px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
    .stat-box.active-card { border-color: var(--accent); background: #132238; }
    .stat-label { font-size: 0.8rem; color: var(--text-sub); margin-bottom: 4px; display: flex; justify-content: space-between; }
    .stat-val { font-size: 1.05rem; font-weight: 700; }
    
    .tab-bar { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 4px; }
    .tab-btn { background: #0b1120; border: 1px solid var(--border); color: var(--text-sub); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--accent); color: #0f172a; font-weight: bold; border-color: var(--accent); }
    
    .filter-summary { background: #0b1120; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 0.82rem; display: flex; justify-content: space-between; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--border); }
    th { color: var(--text-sub); font-weight: 500; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; }
    .badge-sell { background: rgba(248, 113, 113, 0.2); color: var(--sell); }
    .badge-buy { background: rgba(74, 222, 128, 0.2); color: var(--buy); }
    .date-cell { color: var(--text-sub); font-size: 0.75rem; }

    .btn-row { display: flex; gap: 6px; }
    .sub-btn { background: #1e293b; border: 1px solid var(--border); color: var(--text-sub); font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; cursor: pointer; }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: #1e293b; padding: 18px; border-radius: 12px; width: 90%; max-width: 380px; border: 1px solid var(--border); }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.78rem; color: var(--text-sub); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 8px; background: #0b1120; border: 1px solid var(--border); color: #fff; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="top-header">
    <h1>
      <span>📊 프로젝트H</span>
      <span class="sync-badge sync-wait" id="syncStatus">동기화 대기</span>
    </h1>
    <div class="btn-row">
      <button class="sub-btn" onclick="openTokenModal()">🔑 토큰설정</button>
      <button class="sub-btn" onclick="fetchFromGitHub()">🔄 새로고침</button>
      <button class="sub-btn" onclick="openAddModal()">+ 종목추가</button>
    </div>
  </div>

  <!-- 최상단 빅 넘버 실현손익 카드 -->
  <div class="hero-stat-card">
    <div class="hero-main-group">
      <div class="hero-label">💰 총 누적 실현손익 (GitHub 실시간 동기화)</div>
      <div class="hero-big-number" id="heroTotalLoss">0원</div>
    </div>
    <div class="hero-sub-row">
      <div class="hero-sub-item">
        <div class="hero-sub-label">총 회수 현금</div>
        <div class="hero-sub-val" id="heroTotalCash" style="color: var(--accent);">0원</div>
      </div>
      <div class="hero-sub-item">
        <div class="hero-sub-label">총 매매 체결건수</div>
        <div class="hero-sub-val" id="heroTotalCount">0건</div>
      </div>
    </div>
  </div>

  <!-- 카톡 알림 입력창 -->
  <div class="card">
    <div class="input-header">
      <span style="font-weight: 600; font-size: 0.95rem;">📲 체결 알림 붙여넣기</span>
      <div class="date-picker-wrap">
        <span>체결일자:</span>
        <input type="date" id="tradeDateInput" />
      </div>
    </div>
    <textarea id="kakaoInput" placeholder="카카오톡 체결 알림톡 전문을 복사해서 붙여넣으세요..."></textarea>
    <button class="action-btn" id="submitBtn" onclick="parseAndRecord()">GitHub 클라우드에 즉시 저장</button>
  </div>

  <!-- 보유 종목 카드 -->
  <div class="card">
    <div style="font-weight: 600; margin-bottom: 8px; font-size: 0.95rem;">📌 보유 종목 현황 (클릭 시 해당 종목 장부 이동)</div>
    <div class="summary-grid" id="portfolioCards"></div>
  </div>

  <!-- 체결 장부 -->
  <div class="card">
    <div style="font-weight: 600; margin-bottom: 10px; font-size: 0.95rem;">📝 체결 내역 장부</div>
    <div class="tab-bar" id="tabBar"></div>
    <div class="filter-summary" id="filterSummary"></div>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>날짜</th>
            <th>구분</th>
            <th>종목명</th>
            <th>총수량</th>
            <th>체결평단</th>
            <th>실현손익</th>
          </tr>
        </thead>
        <tbody id="tradeHistory"></tbody>
      </table>
    </div>
  </div>

  <!-- 토큰 모달 -->
  <div class="modal-overlay" id="tokenModal">
    <div class="modal-box">
      <h3 style="font-size: 1rem; margin-bottom: 8px;">🔑 GitHub 토큰(PAT) 등록</h3>
      <p style="font-size: 0.75rem; color: var(--text-sub); margin-bottom: 12px; line-height: 1.4;">
        GitHub API로 실시간 읽기/쓰기를 수행하기 위한 토큰입니다. 이 기기 브라우저에만 암호화 보관됩니다.
      </p>
      <div class="form-group">
        <label>Personal Access Token (classic)</label>
        <input type="password" id="mPatToken" placeholder="ghp_xxxxxxxxxxxx" />
      </div>
      <div style="display: flex; gap: 8px; margin-top: 14px;">
        <button class="action-btn" style="padding: 8px;" onclick="saveToken()">저장 및 연결</button>
        <button class="sub-btn" style="flex: 1; padding: 8px;" onclick="closeModal('tokenModal')">닫기</button>
      </div>
    </div>
  </div>

  <!-- 종목 등록/수정 모달 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h3 id="modalTitle" style="font-size: 1rem; margin-bottom: 12px;">종목 정보 등록/수정</h3>
      <div class="form-group">
        <label>종목명</label>
        <input type="text" id="mStockName" placeholder="예: 삼성생명" />
      </div>
      <div class="form-group">
        <label>현재 보유 수량 (주)</label>
        <input type="number" id="mQty" placeholder="예: 10" />
      </div>
      <div class="form-group">
        <label>매수 평단가 (원)</label>
        <input type="number" id="mAvgPrice" placeholder="예: 345000" />
      </div>
      <div class="form-group">
        <label>최종 잔여 목표 수량 (주)</label>
        <input type="number" id="mTargetQty" placeholder="예: 2" />
      </div>
      <div style="display: flex; gap: 8px; margin-top: 14px;">
        <button class="action-btn" style="padding: 8px;" onclick="saveModalStock()">GitHub에 저장</button>
        <button class="sub-btn" style="flex: 1; padding: 8px;" onclick="closeModal('editModal')">취소</button>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_OWNER = "imgates";
    const GITHUB_REPO = "KR-stock-reverse";
    const DATA_FILE_PATH = "data.json";

    let currentFileSha = null;
    let appData = {
      selectedTab: "ALL",
      portfolio: {},
      trades: []
    };

    function getStoredToken() {
      return (localStorage.getItem("GH_SYNC_PAT_TOKEN") || "").trim();
    }

    function setSyncStatus(text, statusClass) {
      const el = document.getElementById("syncStatus");
      el.innerText = text;
      el.className = `sync-badge ${statusClass}`;
    }

    // GitHub data.json 읽기 (안전 방어 로직 탑재)
    async function fetchFromGitHub() {
      const token = getStoredToken();
      if (!token) {
        setSyncStatus("토큰 필요", "sync-wait");
        openTokenModal();
        return;
      }

      setSyncStatus("동기화 중...", "sync-wait");
      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE_PATH}`;

      try {
        const res = await fetch(url, {
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github.v3+json"
          },
          cache: "no-store"
        });

        if (res.status === 401) throw new Error("토큰 인증 실패 (토큰을 재확인하세요)");
        if (res.status === 404) throw new Error("저장소에 data.json 파일이 없습니다.");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        currentFileSha = data.sha;
        
        // Base64 UTF-8 디코딩
        const decodedContent = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
        const parsed = JSON.parse(decodedContent);

        // 핵심 방어 코드: null/undefined 방지
        appData = {
          selectedTab: parsed.selectedTab || "ALL",
          portfolio: (parsed.portfolio && typeof parsed.portfolio === "object") ? parsed.portfolio : {},
          trades: Array.isArray(parsed.trades) ? parsed.trades : []
        };
        
        setSyncStatus("클라우드 동기화 완료", "sync-ok");
        render();
      } catch (err) {
        console.error(err);
        setSyncStatus("동기화 실패", "sync-wait");
        alert("GitHub 로드 오류: " + err.message);
      }
    }

    // GitHub data.json 쓰기
    async function saveToGitHub(commitMsg = "대시보드 데이터 갱신") {
      const token = getStoredToken();
      if (!token) {
        alert("GitHub 토큰이 등록되어 있지 않습니다.");
        openTokenModal();
        return false;
      }

      setSyncStatus("클라우드 저장 중...", "sync-wait");
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;

      const url = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_FILE_PATH}`;
      
      try {
        const jsonStr = JSON.stringify(appData, null, 2);
        const encodedContent = btoa(unescape(encodeURIComponent(jsonStr)));

        const payload = {
          message: commitMsg,
          content: encodedContent,
          sha: currentFileSha
        };

        const res = await fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github.v3+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errRes = await res.json();
          throw new Error(errRes.message || "저장 실패");
        }

        const result = await res.json();
        currentFileSha = result.content.sha;
        setSyncStatus("클라우드 동기화 완료", "sync-ok");
        btn.disabled = false;
        render();
        return true;
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        setSyncStatus("저장 실패", "sync-wait");
        alert("저장 오류 (새로고침 후 다시 시도해보세요): " + err.message);
        return false;
      }
    }

    function extractDate(text) {
      const fullDateMatch = text.match(/20\d{2}[-./](0?[1-9]|1[0-2])[-./](0?[1-9]|[12]\d|3[01])/);
      if (fullDateMatch) return `${String(fullDateMatch[1]).padStart(2, '0')}.${String(fullDateMatch[2]).padStart(2, '0')}`;

      const shortDateMatch = text.match(/(?:체결일자|일자|날짜)?\s*[:\s]?\s*(0?[1-9]|1[0-2])[-./월]\s*(0?[1-9]|[12]\d|3[01])(?:일)?/);
      if (shortDateMatch) return `${String(shortDateMatch[1]).padStart(2, '0')}.${String(shortDateMatch[2]).padStart(2, '0')}`;

      if (text.includes("어제")) {
        const d = new Date();
        d.setDate(d.getDate() - 1);
        return `${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
      }

      const pickerVal = document.getElementById("tradeDateInput").value;
      if (pickerVal) {
        const parts = pickerVal.split("-");
        return `${parts[1]}.${parts[2]}`;
      }

      const now = new Date();
      return `${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')}`;
    }

    async function parseAndRecord() {
      const text = document.getElementById("kakaoInput").value;
      if (!text.trim()) return alert("메시지를 입력해주세요.");

      const nameMatch = text.match(/종\s*목\s*명\s*:\s*([^\n\r]+)/);
      const typeMatch = text.match(/체결종류\s*:\s*(매도|매수)/);
      const qtyMatch = text.match(/체결수량\s*:\s*([0-9,]+)주/);
      const priceMatch = text.match(/체결단가\s*:\s*([0-9,]+)원/);

      if (!nameMatch || !typeMatch || !qtyMatch || !priceMatch) {
        return alert("알림톡 포맷(종목명, 체결종류, 체결수량, 체결단가)을 찾을 수 없습니다.");
      }

      const name = nameMatch[1].trim();
      const type = typeMatch[1];
      const newQty = parseInt(qtyMatch[1].replace(/,/g, ""), 10);
      const newPrice = parseInt(priceMatch[1].replace(/,/g, ""), 10);
      const targetDate = extractDate(text);

      if (!appData.portfolio[name]) {
        alert(`[${name}] 신규 종목이 등록되었습니다. 평단가를 맞추려면 상단 [수정]을 눌러주세요.`);
        appData.portfolio[name] = { qty: 0, avgPrice: 0, cash: 0, targetQty: 0 };
      }

      const target = appData.portfolio[name];
      let newPnl = 0;

      if (type === "매도") {
        newPnl = (newPrice - target.avgPrice) * newQty;
        target.qty = Math.max(0, target.qty - newQty);
        target.cash += (newPrice * newQty);
      } else {
        const totalCost = (target.qty * target.avgPrice) + (newQty * newPrice);
        target.qty += newQty;
        target.avgPrice = Math.round(totalCost / target.qty);
        target.cash = Math.max(0, target.cash - (newPrice * newQty));
      }

      const existingIndex = appData.trades.findIndex(t => t.date === targetDate && t.name === name && t.type === type);

      if (existingIndex > -1) {
        const existing = appData.trades[existingIndex];
        const combinedQty = existing.qty + newQty;
        const combinedAmount = (existing.price * existing.qty) + (newPrice * newQty);
        existing.price = Math.round(combinedAmount / combinedQty);
        existing.qty = combinedQty;
        existing.pnl += newPnl;
      } else {
        appData.trades.unshift({
          date: targetDate,
          type: type,
          name: name,
          qty: newQty,
          price: newPrice,
          pnl: newPnl
        });
        appData.trades.sort((a, b) => b.date.localeCompare(a.date));
      }

      appData.selectedTab = name;

      const ok = await saveToGitHub(`[${name}] ${targetDate} ${type} ${newQty}주 체결 반영`);
      if (ok) {
        document.getElementById("kakaoInput").value = "";
        alert(`[${name}] ${targetDate}자 ${type} ${newQty}주가 GitHub에 영구 저장되었습니다!\n다른 기기에서도 동일하게 반영됩니다.`);
      }
    }

    function selectTab(name) {
      appData.selectedTab = name;
      render();
    }

    function openTokenModal() {
      document.getElementById("mPatToken").value = getStoredToken();
      document.getElementById("tokenModal").style.display = "flex";
    }

    function saveToken() {
      const token = document.getElementById("mPatToken").value.trim();
      if (!token) return alert("토큰을 입력해주세요.");
      localStorage.setItem("GH_SYNC_PAT_TOKEN", token);
      closeModal("tokenModal");
      fetchFromGitHub();
    }

    function openAddModal(targetName = "") {
      const modal = document.getElementById("editModal");
      const nameInput = document.getElementById("mStockName");
      const qtyInput = document.getElementById("mQty");
      const priceInput = document.getElementById("mAvgPrice");
      const targetInput = document.getElementById("mTargetQty");

      if (targetName && appData.portfolio[targetName]) {
        const s = appData.portfolio[targetName];
        document.getElementById("modalTitle").innerText = `${targetName} 정보 수정`;
        nameInput.value = targetName;
        nameInput.disabled = true;
        qtyInput.value = s.qty;
        priceInput.value = s.avgPrice;
        targetInput.value = s.targetQty;
      } else {
        document.getElementById("modalTitle").innerText = "신규 종목 등록";
        nameInput.value = "";
        nameInput.disabled = false;
        qtyInput.value = "";
        priceInput.value = "";
        targetInput.value = "";
      }
      modal.style.display = "flex";
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    async function saveModalStock() {
      const name = document.getElementById("mStockName").value.trim();
      const qty = parseInt(document.getElementById("mQty").value, 10) || 0;
      const price = parseInt(document.getElementById("mAvgPrice").value, 10) || 0;
      const targetQty = parseInt(document.getElementById("mTargetQty").value, 10) || 0;

      if (!name) return alert("종목명을 입력하세요.");

      if (!appData.portfolio[name]) {
        appData.portfolio[name] = { qty, avgPrice: price, cash: 0, targetQty };
      } else {
        appData.portfolio[name].qty = qty;
        appData.portfolio[name].avgPrice = price;
        appData.portfolio[name].targetQty = targetQty;
      }

      closeModal("editModal");
      const ok = await saveToGitHub(`[${name}] 종목 목표치 및 평단가 수정`);
      if (ok) {
        alert(`[${name}] 정보가 GitHub 클라우드에 안전하게 저장되었습니다.`);
      }
    }

    function render() {
      let totalCash = 0;
      let totalLoss = 0;

      const cards = document.getElementById("portfolioCards");
      cards.innerHTML = "";
      
      const portfolioObj = appData.portfolio || {};
      for (const [name, info] of Object.entries(portfolioObj)) {
        if (!info) continue;
        totalCash += (info.cash || 0);
        const isSelected = appData.selectedTab === name ? "active-card" : "";
        cards.innerHTML += `
          <div class="stat-box ${isSelected}" onclick="selectTab('${name}')">
            <div class="stat-label">
              <span><b>${name}</b></span>
              <span onclick="event.stopPropagation(); openAddModal('${name}')" style="text-decoration:underline; font-size:0.75rem; color:var(--accent);">[수정]</span>
            </div>
            <div class="stat-val">${info.qty || 0}주 <span style="font-size:0.75rem; font-weight:normal; color:var(--text-sub);">/ 평단 ${(info.avgPrice || 0).toLocaleString()}원</span></div>
            <div style="font-size:0.75rem; margin-top:4px; color:var(--accent);">회수현금: ${(info.cash || 0).toLocaleString()}원 | 목표: ${info.targetQty || 0}주</div>
          </div>
        `;
      }

      const tradesArr = Array.isArray(appData.trades) ? appData.trades : [];
      tradesArr.forEach(t => {
        if (typeof t.pnl === "number") totalLoss += t.pnl;
      });

      const heroEl = document.getElementById("heroTotalLoss");
      const sign = totalLoss > 0 ? "+" : "";
      heroEl.innerText = `${sign}${totalLoss.toLocaleString()}원`;
      heroEl.style.color = totalLoss < 0 ? "var(--sell)" : (totalLoss > 0 ? "var(--buy)" : "var(--text-main)");

      document.getElementById("heroTotalCash").innerText = `${totalCash.toLocaleString()}원`;
      document.getElementById("heroTotalCount").innerText = `${tradesArr.length}건`;

      const tabBar = document.getElementById("tabBar");
      const stockNames = ["ALL", ...Object.keys(portfolioObj)];
      tabBar.innerHTML = stockNames.map(name => {
        const label = name === "ALL" ? "전체보기" : name;
        const activeClass = appData.selectedTab === name ? "active" : "";
        return `<button class="tab-btn ${activeClass}" onclick="selectTab('${name}')">${label}</button>`;
      }).join("");

      const currentTab = appData.selectedTab || "ALL";
      const filteredTrades = currentTab === "ALL" 
        ? tradesArr 
        : tradesArr.filter(t => t.name === currentTab);

      let tabLoss = 0;
      let tabCash = 0;

      filteredTrades.forEach(t => {
        if (t.pnl) tabLoss += t.pnl;
        if (t.type === "매도") tabCash += (t.price * t.qty);
      });

      const summaryText = currentTab === "ALL"
        ? `전체 체결일자별 기록: <b>${filteredTrades.length}건</b>`
        : `<b>${currentTab}</b> 실현손익: <b style="color:var(--sell)">${tabLoss.toLocaleString()}원</b> | 누적회수금: <b style="color:var(--accent)">${tabCash.toLocaleString()}원</b>`;
      document.getElementById("filterSummary").innerHTML = summaryText;

      const history = document.getElementById("tradeHistory");
      if (filteredTrades.length === 0) {
        history.innerHTML = `<tr><td colspan="6" style="color:var(--text-sub); padding:16px;">체결 내역이 없습니다.</td></tr>`;
      } else {
        history.innerHTML = filteredTrades.map(t => {
          const badgeClass = t.type === "매도" ? "badge-sell" : "badge-buy";
          const pnlColor = t.pnl < 0 ? 'var(--sell)' : (t.pnl > 0 ? 'var(--buy)' : 'inherit');
          return `
            <tr>
              <td class="date-cell">${t.date || '-'}</td>
              <td><span class="badge ${badgeClass}">${t.type}</span></td>
              <td><b>${t.name}</b></td>
              <td><b>${t.qty}주</b></td>
              <td>${(t.price || 0).toLocaleString()}원</td>
              <td style="color: ${pnlColor}">${t.pnl ? t.pnl.toLocaleString() + '원' : '-'}</td>
            </tr>
          `;
        }).join("");
      }
    }

    function initDatePicker() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById("tradeDateInput").value = `${yyyy}-${mm}-${dd}`;
    }

    initDatePicker();
    fetchFromGitHub();
  </script>
</body>
</html>
