<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V4.0 리버스 대시보드</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
    h1 { margin: 0; font-size: 1.4rem; color: #38bdf8; }
    .update-time { font-size: 0.8rem; color: #94a3b8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; }
    .card-head { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; margin-bottom: 12px; }
    .star-badge { background: rgba(250, 204, 21, 0.1); border: 1px solid #facc15; color: #facc15; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 14px; }
    .star-val { font-size: 1.5rem; font-weight: bold; margin-top: 4px; }
    .orders { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .order-box { padding: 10px; border-radius: 8px; text-align: center; font-size: 0.85rem; }
    .box-sell { background: rgba(248, 113, 113, 0.1); border: 1px solid #f87171; color: #f87171; }
    .box-buy { background: rgba(74, 222, 128, 0.1); border: 1px solid #4ade80; color: #4ade80; }
    .order-price { font-size: 1.1rem; font-weight: bold; margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 6px; text-align: right; border-bottom: 1px solid #334155; }
    th:first-child, td:first-child { text-align: left; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>무한매수법 V4.0 리버스 대시보드</h1>
        <div style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">하이닉스 · SK스퀘어 비중 75% 축소 트래커</div>
      </div>
      <div id="updated-at" class="update-time">데이터 로딩 중...</div>
    </div>
    <div class="grid" id="dashboard"></div>
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch(`data.json?t=${Date.now()}`);
        const data = await res.json();
        
        document.getElementById("updated-at").innerText = `최근 갱신: ${data.updated_at}`;
        const container = document.getElementById("dashboard");
        container.innerHTML = "";

        for (const [code, s] of Object.entries(data.stocks)) {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="card-head">
              <span>${s.name}</span>
              <span style="font-size:0.85rem; color:#94a3b8;">${code}</span>
            </div>
            <div style="font-size:0.85rem; margin-bottom:8px; color:#cbd5e1;">
              보유: <b>${s.held}주</b> (목표 잔여: ${s.held - s.reduce_target}주) | 매입가: ${s.avg_price.toLocaleString()}원
            </div>
            
            <div class="star-badge">
              <div>★ 직전 5거래일 별지점</div>
              <div class="star-val">${s.star_point.toLocaleString()}원</div>
            </div>

            <div class="orders">
              <div class="order-box box-sell">
                <div>별지점 위 지정가 매도</div>
                <div class="order-price">${s.sell_order.toLocaleString()}원</div>
                <div>${s.sell_qty > 0 ? s.sell_qty + '주 매도' : '매도 일시정지'}</div>
              </div>
              <div class="order-box box-buy">
                <div>별지점 아래 지정가 매수</div>
                <div class="order-price">${s.buy_order.toLocaleString()}원</div>
                <div>(누적잔금/4 충족 시)</div>
              </div>
            </div>

            <table>
              <thead><tr><th>거래일</th><th>종가</th></tr></thead>
              <tbody>
                ${s.history.map(h => `<tr><td>${h.date}</td><td>${h.close.toLocaleString()}원</td></tr>`).join("")}
              </tbody>
            </table>
          `;
          container.appendChild(card);
        }
      } catch (err) {
        document.getElementById("dashboard").innerHTML = "<p>데이터를 불러오는 중입니다. 첫 실행이 끝날 때까지 잠시 기다려주세요.</p>";
      }
    }
    loadData();
  </script>
</body>
</html>
